# Preserve application JSON errors; normalize only errors generated by Nginx.
proxy_intercept_errors off;
error_page 400 = @itgla_api_400;
error_page 403 = @itgla_api_403;
error_page 404 = @itgla_api_404;
error_page 500 = @itgla_api_500;
error_page 502 = @itgla_api_502;
error_page 503 = @itgla_api_503;
error_page 504 = @itgla_api_504;
