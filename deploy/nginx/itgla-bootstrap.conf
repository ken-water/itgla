# Temporary HTTP-only vhost used to obtain the dedicated ITGLA certificate.
# Replace this file with itgla.conf after Certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name itgla.com www.itgla.com app.itgla.com api.itgla.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/itgla-site/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
