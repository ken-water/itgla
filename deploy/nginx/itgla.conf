log_format itgla_analytics escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,"bytes_sent":$body_bytes_sent,"content_type":"$sent_http_content_type","referer":"$http_referer","user_agent":"$http_user_agent"}';

server {
    listen 80;
    listen [::]:80;
    server_name itgla.com www.itgla.com app.itgla.com api.itgla.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/itgla-site/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.itgla.com;

    ssl_certificate /etc/letsencrypt/live/itgla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itgla.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://itgla.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.itgla.com;

    ssl_certificate /etc/letsencrypt/live/itgla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itgla.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://itgla.com/downloads.html;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.itgla.com;

    ssl_certificate /etc/letsencrypt/live/itgla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itgla.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":"not_found","message":"ITGLA v0.1.1 has no hosted API"}';
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name itgla.com;

    ssl_certificate /etc/letsencrypt/live/itgla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itgla.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/itgla-site/current;
    index index.html;
    access_log /var/log/itgla/nginx-access.log itgla_analytics;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/healthz {
        default_type application/json;
        return 404 '{"error":"not_found","message":"ITGLA v0.1.1 has no hosted API"}';
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/itgla-site/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /downloads/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
