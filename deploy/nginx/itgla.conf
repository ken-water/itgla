# Keep query credentials and sign-in tokens out of access logs and referrers.
map $http_referer $itgla_safe_referer {
    default "-";
    "~^(?<itgla_referer_path>[^?#]+)" $itgla_referer_path;
}

map $args $itgla_admin_credential_query {
    default 0;
    "~*(^|&)(username|password)(=|&|$)" 1;
}

# Internal error-page routing must not replace the original path in analytics.
map $request_uri $itgla_log_path {
    default "/";
    "~^(?<itgla_original_path>[^?]+)" $itgla_original_path;
}

log_format itgla_analytics escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request_method $itgla_log_path $server_protocol","status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time,"upstream_response_time":"$upstream_response_time","content_type":"$sent_http_content_type","referer":"$itgla_safe_referer","user_agent":"$http_user_agent"}';

server {
    listen 80;
    listen [::]:80;
    server_name itgla.com www.itgla.com app.itgla.com api.itgla.com;
    access_log /var/log/itgla/nginx-redirect-access.log itgla_analytics;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/itgla-site/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.itgla.com;
    access_log /var/log/itgla/nginx-redirect-access.log itgla_analytics;

    ssl_certificate /etc/letsencrypt/live/itgla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itgla.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://itgla.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.itgla.com;
    access_log /var/log/itgla/nginx-redirect-access.log itgla_analytics;

    ssl_certificate /etc/letsencrypt/live/itgla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itgla.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://itgla.com/downloads.html;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.itgla.com;
    access_log /var/log/itgla/nginx-redirect-access.log itgla_analytics;

    ssl_certificate /etc/letsencrypt/live/itgla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itgla.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":"not_found","message":"ITGLA v0.2.0 has no hosted API"}';
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name itgla.com;

    ssl_certificate /etc/letsencrypt/live/itgla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itgla.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/itgla-site/current;
    index index.html;
    access_log /var/log/itgla/nginx-access.log itgla_analytics;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    error_page 400 /_errors/400.html;
    error_page 403 /_errors/403.html;
    error_page 404 /_errors/404.html;
    error_page 500 /_errors/500.html;
    error_page 502 /_errors/502.html;
    error_page 503 /_errors/503.html;
    error_page 504 /_errors/504.html;
    proxy_intercept_errors on;

    location ^~ /_errors/ {
        internal;
        alias /var/www/itgla-site/current/;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
    location = /400.html { return 400; }
    location = /403.html { return 403; }
    location = /404.html { return 404; }
    location = /500.html { return 500; }
    location = /502.html { return 502; }
    location = /503.html { return 503; }
    location = /504.html { return 504; }

    location /api/ {
        include /etc/nginx/snippets/itgla-api-errors.conf;
        return 404;
    }

    location @itgla_api_400 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 400 '{"error":"http_400","message":"Check this request."}';
    }
    location @itgla_api_403 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 403 '{"error":"http_403","message":"This page is restricted."}';
    }
    location @itgla_api_404 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 404 '{"error":"http_404","message":"This page does not exist."}';
    }
    location @itgla_api_500 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 500 '{"error":"http_500","message":"Something went wrong."}';
    }
    location @itgla_api_502 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 502 '{"error":"http_502","message":"This service is temporarily unavailable."}';
    }
    location @itgla_api_503 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 503 '{"error":"http_503","message":"Please try again shortly."}';
    }
    location @itgla_api_504 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 504 '{"error":"http_504","message":"This request took too long."}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/healthz {
        include /etc/nginx/snippets/itgla-api-errors.conf;
        default_type application/json;
        return 404 '{"error":"not_found","message":"ITGLA v0.2.0 has no hosted API"}';
    }

    location = /api/feedback {
        include /etc/nginx/snippets/itgla-api-errors.conf;
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /feedback.js {
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /auth.js {
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /auth/me {
        include /etc/nginx/snippets/itgla-api-errors.conf;
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /auth/logout {
        include /etc/nginx/snippets/itgla-api-errors.conf;
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/workspace/ {
        include /etc/nginx/snippets/itgla-api-errors.conf;
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /auth/email/start {
        include /etc/nginx/snippets/itgla-api-errors.conf;
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/auth/google/(start|callback)$ {
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location = /auth/email/verify {
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /auth/email/status {
        include /etc/nginx/snippets/itgla-api-errors.conf;
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /admin {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        if ($itgla_admin_credential_query) { return 303 /admin; }
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ^~ /admin/api/ {
        include /etc/nginx/snippets/itgla-api-errors.conf;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        if ($itgla_admin_credential_query) { return 303 /admin; }
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ^~ /admin/ {
        # Compress static admin assets, including Chart.js served as text/javascript.
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/javascript application/javascript text/css;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        if ($itgla_admin_credential_query) { return 303 /admin; }
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/itgla-site/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Preserve published URLs without case-colliding files on Windows.
    location = /downloads/v0.3.30/SHA256SUMS {
        return 301 /downloads/v0.3.30/sha256sums$is_args$args;
    }

    location = /llm.txt {
        return 301 /llms.txt$is_args$args;
    }

    location ^~ /downloads/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
