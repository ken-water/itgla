name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
      - name: Require a version tag
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Dispatch this workflow from a v* release tag" >&2; exit 1 ;;
          esac
      - name: Build unsigned DMG
        run: |
          cargo install cargo-packager --locked --version 0.11.8
          chmod +x scripts/package-macos.sh
          scripts/package-macos.sh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: itgla-macos-arm64
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
      - name: Attach DMG to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.dmg dist/*.sha256 --clobber
