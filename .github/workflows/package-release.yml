name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable source release tag (v-prefixed)
        required: true
        default: v0.6.3
        type: string

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - name: Validate release and architecture
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(uname -m)" = arm64
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "v$version" = "$RELEASE_TAG"
          git rev-parse HEAD
      - name: Build unsigned DMG
        run: |
          cargo install cargo-packager --locked --version 0.11.8
          chmod +x scripts/package-macos.sh
          scripts/package-macos.sh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: itgla-macos-arm64
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
      - name: Attach DMG to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/*.dmg dist/*.sha256 --clobber
