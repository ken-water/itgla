name: Website

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Add release fixtures
        run: |
          mkdir -p downloads/v0.1.1
          touch downloads/v0.1.1/itgla-v0.1.1-windows-x86_64.zip
          touch downloads/v0.1.1/itgla-v0.1.1-linux-x86_64.tar.gz

      - name: Run responsive smoke tests
        run: npm test
