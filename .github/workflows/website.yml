name: Website

on:
  pull_request:
    paths:
      - "website/**"
      - "server/analytics/**"
      - "scripts/check-english-ui.mjs"
      - "ui/app.slint"
      - "src/**"
      - "deploy/nginx/itgla.conf"
      - ".github/workflows/website.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "server/analytics/**"
      - "scripts/check-english-ui.mjs"
      - "ui/app.slint"
      - "src/**"
      - "deploy/nginx/itgla.conf"
      - ".github/workflows/website.yml"

permissions:
  contents: read

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run responsive smoke tests
        run: npm test

      - name: Run analytics unit tests
        working-directory: server/analytics
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test
