[package]
name = "itgla"
version = "0.0.5"
edition = "2024"
description = "Local-first IT resource relationship manager"
license = "Proprietary"

[dependencies]
slint = { version = "1.18.0", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-18",
    "renderer-software",
    "software-renderer-systemfonts",
] }
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[build-dependencies]
slint-build = "1.18.0"

[profile.release]
lto = "thin"
strip = true
