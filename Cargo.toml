[package]
name = "itgla"
version = "0.3.30"
edition = "2024"
description = "Local-first IT resource relationship manager"
license = "Proprietary"

[package.metadata.packager]
product-name = "ITGLA"
identifier = "com.itgla.desktop"
publisher = "ITGLA"
homepage = "https://itgla.com"
description = "Local-first IT resource relationship manager"
formats = ["nsis", "deb", "appimage", "dmg"]
icons = ["assets/itgla.png"]

[dependencies]
arboard = { version = "3.6.1", default-features = false }
calamine = { version = "0.36.1", default-features = false }
csv = "1.4.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
slint = { version = "1.18.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-18",
    "renderer-software",
    "software-renderer-systemfonts",
] }
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
# Official Slint headless backend. It exercises real pointer/keyboard behavior in
# tests without adding code or dependencies to production packages.
i-slint-backend-testing = "1.18.1"

[profile.release]
lto = "thin"
strip = true
