    # Owner ken-water; reassess by 2026-11-24. See workspace implementation evidence.
    { id = "RUSTSEC-2026-0433", reason = "Slint i-slint-common 1.18.1 styled_text::parse_interpolated enables only ENABLE_STRIKETHROUGH. ITGLA has no direct Markdown parser and does not enable ENABLE_WIKILINKS or Options::all; the advisory explicitly excludes this configuration." },
