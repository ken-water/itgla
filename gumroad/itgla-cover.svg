<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ITGLA — IT in a glance</title>
  <desc id="desc">A calm visual map connecting domains, servers and services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8f5"/><stop offset="1" stop-color="#dcece5"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".96"/><stop offset="1" stop-color="#eef7f2" stop-opacity=".9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#173f36" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1140" cy="80" r="220" fill="#0f7664" opacity=".08"/><circle cx="80" cy="670" r="190" fill="#c17d11" opacity=".08"/>
  <g transform="translate(88 82)"><rect width="68" height="68" rx="18" fill="#fff" filter="url(#shadow)"/><path d="M21 18h26M34 18v35M21 53h26" fill="none" stroke="#173f36" stroke-width="6" stroke-linecap="round"/><path d="M19 35h30" stroke="#0f7664" stroke-width="2" opacity=".55"/><circle cx="21" cy="18" r="4" fill="#0f7664"/><circle cx="47" cy="53" r="4" fill="#c17d11"/></g>
  <text x="178" y="126" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f36">ITGLA</text>
