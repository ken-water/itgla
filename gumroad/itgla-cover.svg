  <text x="96" y="306" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" fill="#47665d">See what you have. Understand how it connects.</text>
  <g transform="translate(640 176)" filter="url(#shadow)"><rect width="540" height="390" rx="24" fill="url(#panel)" stroke="#c9ddd5"/>
    <path d="M110 108C190 80 250 105 300 160S405 230 455 190M110 275C185 240 230 230 300 160S390 120 455 94" fill="none" stroke="#84b9a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 11"/>
    <g><circle cx="110" cy="108" r="30" fill="#0f7664"/><text x="110" y="116" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="700" fill="#fff">DNS</text><text x="110" y="158" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#47665d">domain</text></g>
    <g><circle cx="300" cy="160" r="38" fill="#173f36"/><text x="300" y="168" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="700" fill="#fff">01</text><text x="300" y="214" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#47665d">server</text></g>
    <g><circle cx="455" cy="94" r="30" fill="#c17d11"/><text x="455" y="102" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="700" fill="#fff">API</text><text x="455" y="144" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#47665d">service</text></g>
    <g><circle cx="110" cy="275" r="30" fill="#5d7fa3"/><text x="110" y="283" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="700" fill="#fff">DB</text><text x="110" y="325" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#47665d">database</text></g>
  </g>
  <text x="96" y="625" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#0f7664">Local-first inventory · relationships · handover clarity</text>
